name: python-test
on: push

jobs: 
  pythonjob:
    runs-on: ubuntu-latest
    steps: 
	  - name: checkout
	    uses: actions/checkout@v4
	  - name: setup-python
	    uses: actions/setup-python@v5
	    with:
		  python-version: '3.11'
	  - name: Install dependencies
	    run: |
		  python -m pip install --upgrade pip
		  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
	  - name: Run tests
	    run: pytest
  
